name: Deploy React Vite to OVH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Rien ne part en production si le code ne passe pas le lint et les tests.
      # Le lint vise src/ : public/catan est l'export Godot généré de HEXLAND.
      - name: Lint
        run: npx eslint src

      - name: Test
        run: npm test

      - name: Build production files
        env:
          VITE_CAREER_GAME_ENABLED: 'true'
          VITE_SPIN_ENABLED: 'true'
          VITE_MONOVOMY_ENABLED: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://beogtdhvvmeelwkrdkwp.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_sjmurvPdnBYAFAT5pK3Z8w_M2dUldGF' }}
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/contact.php
          test -d dist/assets
          ls -la dist

      # L'hébergement OVH est à la limite de son quota disque (553 Disk quota
      # exceeded). HEXLAND est servi en Brotli (catan/.htaccess réécrit vers
      # index.wasm.br dès que le navigateur accepte br, soit tous les navigateurs
      # actuels en HTTPS) : la copie brute de 39 Mo n'est jamais téléchargée.
      - name: Drop uncompressed HEXLAND wasm
        run: |
          test -f dist/catan/index.wasm.br
          rm dist/catan/index.wasm
          du -sh dist

      - name: Deploy to OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftp
          # Envoi incrémental (fichier d'état .ftp-deploy-sync-state.json sur le
          # serveur) : un échec en cours d'envoi ne vide plus tout le site.

      # Contrôle de la production : la page d'accueil doit référencer le build
      # qu'on vient d'envoyer, chaque fichier JS/CSS doit être servi avec le bon
      # type (sinon : écran blanc) et les routes principales doivent répondre.
      - name: Smoke test production
        env:
          SITE_URL: https://mathis-rvrs.fr
        run: |
          set -u
          expected=$(grep -oE 'assets/index-[^"]+\.js' dist/index.html | head -1)
          echo "Build attendu : $expected"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$SITE_URL/?deploy=$GITHUB_SHA" | grep -q "$expected"; then
              echo "index.html à jour"
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::La production ne sert pas le nouveau build ($expected)"
              exit 1
            fi
            sleep 10
          done

          failed=0
          for file in dist/assets/*.js dist/assets/*.css; do
            path="/assets/$(basename "$file")"
            type=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$SITE_URL$path")
            case "$file" in
              *.js) want=javascript ;;
              *.css) want=css ;;
            esac
            if ! echo "$type" | grep -q "^200 .*$want"; then
              echo "::error::$path servi en « $type »"
              failed=1
            fi
          done

          for route in / /games /games/soiree /monovomy /carriere /spin /catan/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$SITE_URL$route")
            echo "$route -> $code"
            [ "$code" = 200 ] || { echo "::error::$route répond $code"; failed=1; }
          done

          exit $failed
