name: Deploy React Vite to OVH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Rien ne part en production si le code ne passe pas le lint et les tests.
      # Le lint vise src/ : public/catan est l'export Godot généré de HEXLAND.
      - name: Lint
        run: npx eslint src

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production files
        env:
          VITE_CAREER_GAME_ENABLED: 'true'
          VITE_SPIN_ENABLED: 'true'
          VITE_MONOVOMY_ENABLED: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://beogtdhvvmeelwkrdkwp.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_sjmurvPdnBYAFAT5pK3Z8w_M2dUldGF' }}
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/contact.php
          test -d dist/assets
          ls -la dist

      # L'hébergement OVH est à la limite de son quota disque (553 Disk quota
      # exceeded). HEXLAND est servi en Brotli (catan/.htaccess réécrit vers
      # index.wasm.br dès que le navigateur accepte br, soit tous les navigateurs
      # actuels en HTTPS) : la copie brute de 39 Mo n'est jamais téléchargée.
      - name: Drop uncompressed HEXLAND wasm
        run: |
          test -f dist/catan/index.wasm.br
          # Mis de côté, pas supprimé : le VPS (sans quota) le reçoit après OVH.
          mv dist/catan/index.wasm "$RUNNER_TEMP/"
          du -sh dist

      - name: Deploy to OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftp
          # Envoi incrémental (fichier d'état .ftp-deploy-sync-state.json sur le
          # serveur) : un échec en cours d'envoi ne vide plus tout le site.

      # Contrôle de la production (voir scripts/smoke-test.sh).
      - name: Smoke test production
        run: scripts/smoke-test.sh https://mathis-rvrs.fr

      # VPS (Caddy frontal + FrankenPHP, deploy/site), après OVH qui reste la production tant que
      # le DNS n'a pas basculé : un échec ici ne bloque pas OVH. Wasm brut remis (pas de quota).
      # Clé dédiée, limitée côté serveur à rrsync dans /opt/site/www. Tant que le DNS pointe
      # vers OVH, le VPS est visé par son IP (certificat local : -k).
      - name: Deploy to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mv "$RUNNER_TEMP/index.wasm" dist/catan/
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          echo '185.226.172.52 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE8ujsYTA/UJFTdglRnPALWMtSGSk7fFm6P4v/d4gQDG' > ~/.ssh/known_hosts
          rsync -rlptz --delete-after --delay-updates --exclude '.htaccess' \
            -e 'ssh -i ~/.ssh/vps -o IdentitiesOnly=yes' dist/ site@185.226.172.52:

      - name: Smoke test VPS
        run: scripts/smoke-test.sh https://mathis-rvrs.fr --resolve mathis-rvrs.fr:443:185.226.172.52 -k
