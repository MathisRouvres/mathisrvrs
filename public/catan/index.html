<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>HEXLAND</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body {
	color: #eef4fa;
	background-color: #0f1621;
	overflow: hidden;
	touch-action: none;
	overscroll-behavior: none;
	font-family: 'Avenir Next', 'Segoe UI', 'Noto Sans', Arial, sans-serif;
}
#canvas { display: block; }
#canvas:focus { outline: none; }

/* Ecran de chargement aux couleurs du jeu. Le premier chargement d'un build Godot web
   pese plusieurs megaoctets : l'attente doit rester lisible et rassurante. */
#loader {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 1.4rem;
	background:
		radial-gradient(circle at 50% 35%, #1d3b57 0%, transparent 60%),
		linear-gradient(180deg, #16283a 0%, #0f1621 70%);
	z-index: 10;
	transition: opacity 0.45s ease;
}
#loader.hidden { opacity: 0; pointer-events: none; }
#loader-title {
	font-size: clamp(2.2rem, 11vw, 4rem);
	letter-spacing: 0.22em;
	font-weight: 700;
	color: #f2c14e;
	margin: 0;
}
#loader-subtitle { color: #9db1c6; font-size: 0.95rem; margin: 0; text-align: center; }
#loader-hexes { display: flex; gap: 0.5rem; }
.hex {
	width: 26px; height: 30px;
	background: #2f6b40;
	clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
	animation: pulse 1.4s ease-in-out infinite;
}
.hex:nth-child(2) { background: #e0b64a; animation-delay: 0.15s; }
.hex:nth-child(3) { background: #b3603a; animation-delay: 0.3s; }
.hex:nth-child(4) { background: #8dbf5c; animation-delay: 0.45s; }
.hex:nth-child(5) { background: #7c828c; animation-delay: 0.6s; }
@keyframes pulse { 0%, 100% { transform: translateY(0); opacity: 0.55; } 50% { transform: translateY(-7px); opacity: 1; } }
#loader-bar {
	width: min(72vw, 360px);
	height: 10px;
	background: #22354a;
	border-radius: 999px;
	overflow: hidden;
}
#loader-fill { width: 0%; height: 100%; background: #f2c14e; transition: width 0.2s ease; }
#loader-percent { color: #eef4fa; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
#loader-error {
	display: none;
	max-width: 80vw;
	padding: 1rem;
	border-radius: 0.6rem;
	background: #3a1f24;
	border: 1px solid #8a3b45;
	color: #f4d7d7;
	text-align: center;
	line-height: 1.4;
}

/* Bandeau de mise a jour. Il n'interrompt jamais une partie : le rechargement est
   propose, jamais impose. */
#update-banner {
	position: fixed;
	left: 50%;
	bottom: max(1rem, env(safe-area-inset-bottom));
	transform: translateX(-50%);
	display: none;
	align-items: center;
	gap: 0.8rem;
	padding: 0.7rem 1rem;
	border-radius: 0.7rem;
	background: #182534;
	border: 1px solid #3a5169;
	color: #eef4fa;
	font-size: 0.9rem;
	z-index: 20;
	box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
}
#update-banner button {
	border: 0;
	border-radius: 0.5rem;
	padding: 0.5rem 0.9rem;
	background: #f2c14e;
	color: #16283a;
	font-weight: 600;
	min-height: 44px;
	min-width: 44px;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HEXLAND"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0f1621"><style>html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0f1621;}canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;outline:none;}</style>
	</head>
	<body>
		<canvas id="canvas">Votre navigateur ne supporte pas l'element canvas.</canvas>
		<noscript>Ce jeu a besoin de JavaScript pour fonctionner.</noscript>

		<div id="loader">
			<h1 id="loader-title">HEXLAND</h1>
			<div id="loader-hexes"><i class="hex"></i><i class="hex"></i><i class="hex"></i><i class="hex"></i><i class="hex"></i></div>
			<div id="loader-bar"><div id="loader-fill"></div></div>
			<div id="loader-percent">0 %</div>
			<p id="loader-subtitle">Premier chargement : le jeu est mis en cache,<br>les fois suivantes seront immediates.</p>
			<div id="loader-error"></div>
		</div>

		<div id="update-banner">
			<span>Nouvelle version disponible.</span>
			<button type="button" id="update-reload">Recharger</button>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":406388,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// Etat partage avec le jeu, lu depuis GDScript via JavaScriptBridge.
window.hexland = {
	version: '2cc9c2f',
	updateAvailable: false,
	installPromptAvailable: false,
	installOutcome: '',
	offlineReady: false,
};

(function () {
	const loader = document.getElementById('loader');
	const fill = document.getElementById('loader-fill');
	const percent = document.getElementById('loader-percent');
	const errorBox = document.getElementById('loader-error');
	const banner = document.getElementById('update-banner');

	// --- Invite d'installation ---
	// L'evenement est capture mais l'invite n'est PAS affichee tout de suite :
	// le jeu la declenchera lui-meme apres une premiere partie terminee.
	let deferredPrompt = null;
	window.addEventListener('beforeinstallprompt', (event) => {
		event.preventDefault();
		deferredPrompt = event;
		window.hexland.installPromptAvailable = true;
	});
	window.hexland.showInstallPrompt = function () {
		if (!deferredPrompt) { return false; }
		deferredPrompt.prompt();
		deferredPrompt.userChoice.then((choice) => {
			window.hexland.installOutcome = choice.outcome;
			window.hexland.installPromptAvailable = false;
			deferredPrompt = null;
		});
		return true;
	};
	window.addEventListener('appinstalled', () => {
		window.hexland.installPromptAvailable = false;
		window.hexland.installOutcome = 'installed';
	});

	// --- Detection de mise a jour ---
	// Une nouvelle version n'est jamais appliquee a chaud : elle attend le prochain
	// lancement, pour ne pas casser une partie en cours.
	document.getElementById('update-reload').addEventListener('click', () => {
		window.location.reload();
	});
	function watchServiceWorker() {
		if (!('serviceWorker' in navigator)) { return; }
		navigator.serviceWorker.getRegistration().then((registration) => {
			if (!registration) { return; }
			window.hexland.offlineReady = true;
			registration.addEventListener('updatefound', () => {
				const installing = registration.installing;
				if (!installing) { return; }
				installing.addEventListener('statechange', () => {
					if (installing.state === 'installed' && navigator.serviceWorker.controller) {
						window.hexland.updateAvailable = true;
						banner.style.display = 'flex';
					}
				});
			});
			registration.update().catch(() => {});
		}).catch(() => {});
	}

	// --- Chargement ---
	function showError(message) {
		errorBox.textContent = message;
		errorBox.style.display = 'block';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		showError('Ce navigateur ne supporte pas : ' + missing.join(', '));
	} else {
		engine.startGame({
			onProgress: function (current, total) {
				if (current > 0 && total > 0) {
					const ratio = Math.min(1, current / total);
					fill.style.width = (ratio * 100).toFixed(0) + '%';
					percent.textContent = (ratio * 100).toFixed(0) + ' %';
				}
			},
		}).then(() => {
			fill.style.width = '100%';
			percent.textContent = '100 %';
			loader.classList.add('hidden');
			setTimeout(() => loader.remove(), 500);
			watchServiceWorker();
		}, (err) => {
			console.error(err);
			showError(typeof err === 'string' ? err : (err && err.message) || 'Erreur inconnue.');
		});
	}
}());
		</script>
	</body>
</html>
