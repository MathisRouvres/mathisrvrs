<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hors ligne — MonoVomy</title>
    <meta name="theme-color" content="#0a0613" />
    <link rel="icon" type="image/svg+xml" href="/monovomy-icons/icon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top) + 1.5rem) 1.5rem calc(env(safe-area-inset-bottom) + 1.5rem);
        font-family: system-ui, -apple-system, sans-serif;
        color: #ebe4fb;
        background:
          radial-gradient(900px 500px at 12% -5%, rgba(124, 58, 237, 0.28), transparent 60%),
          radial-gradient(800px 460px at 92% 4%, rgba(236, 30, 121, 0.22), transparent 60%),
          #0a0613;
        text-align: center;
      }
      .card {
        max-width: 26rem;
        background: rgba(33, 20, 65, 0.6);
        border: 1px solid #33215c;
        border-radius: 1.25rem;
        padding: 2rem 1.5rem;
        backdrop-filter: blur(12px);
      }
      img { width: 84px; height: 84px; margin-bottom: 1rem; }
      h1 { margin: 0 0 0.5rem; font-size: 1.4rem; }
      .brand b { color: #f5b21a; }
      .brand i { color: #ec1e79; font-style: normal; }
      p { margin: 0.5rem 0 0; color: #9a8cb8; line-height: 1.5; }
      .actions { margin-top: 1.5rem; }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.9rem;
        padding: 0.75rem 1.4rem;
        font-size: 1rem;
        font-weight: 600;
        color: #0a0613;
        background: linear-gradient(90deg, #f5b21a, #ec1e79);
        cursor: pointer;
      }
      ul { text-align: left; margin: 1.25rem 0 0; padding-left: 1.2rem; color: #ebe4fb; }
      li { margin: 0.35rem 0; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/monovomy-icons/icon.svg" alt="" />
      <h1 class="brand"><b>Mono</b><i>Vomy</i></h1>
      <p>Tu es hors ligne. La connexion est nécessaire pour rejoindre une partie en ligne.</p>
      <ul>
        <li>Le mode local (hot-seat) reste jouable sans réseau.</li>
        <li>Les règles restent accessibles.</li>
        <li>Reconnecte-toi pour les parties en ligne.</li>
      </ul>
      <div class="actions">
        <button type="button" onclick="location.href='/monovomy'">Réessayer</button>
      </div>
    </main>
  </body>
</html>
