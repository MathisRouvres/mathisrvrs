# Dashboard privé, lancé depuis /opt/dashboard. Protégé par le Caddy frontal (snippet « private »).
# Les rapports de scan sont lus en lecture seule depuis le volume dashboard-reports ; les scans
# écrivent dedans via scan.sh (SCAN_OUTPUT_DIR), voir README.
name: dashboard

services:
  web:
    build: .
    image: mathisrvrs-dashboard:local
    environment:
      PORT: "8300"
      REPORTS_DIR: /reports
      STATS_URL: https://mathis-rvrs.fr/stats
      PROSPECT_URL: https://prospect.mathis-rvrs.fr
      ORIGIN: https://dashboard.mathis-rvrs.fr
      # Nom du volume vu par le daemon Docker (préfixe projet compose) : monté dans les conteneurs
      # d'outils frères lancés par scan.sh.
      SCAN_DOCKER_VOLUME: dashboard_dashboard-reports
    volumes:
      # Les rapports : RW car les scans lancés depuis le web écrivent dedans.
      - dashboard-reports:/reports
      # Socket Docker : permet à scan.sh de lancer les outils (testssl/nuclei/zap). Privilège
      # équivalent root sur l'hôte — service accessible uniquement derrière le login de l'espace privé.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      edge:
        aliases: [dashboard-web]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    external: true

volumes:
  dashboard-reports:
